<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Tanzanian Crafts</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      background-color: #f0f8ff;
      padding: 20px;
    }
    h1 {
      color: darkorange;
    }
    .gallery {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .gallery img {
      max-width: 300px;
      height: auto;
      border: 5px solid #4CAF50;
      border-radius: 8px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
    }
    p {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Explore Tanzanian Crafts & Traditional Items</h1>
  <div class="gallery">
    <div>
      <img src="images/tourist_clothes.jpg" alt="Tanzanian Tourist Clothes">
      <p>Traditional Tourist Clothes from Tanzania</p>
    </div>
    <div>
      <img src="images/traditional_arrows.jpg" alt="Traditional Arrows from Tanzania">
      <p>Handcrafted Traditional Arrows</p>
    </div>
    <div>
      <img src="images/handicraft_item.jpg" alt="Unique Tanzanian Handicrafts">
      <p>Unique Handicrafts Resembling Tanzania's Culture</p>
    </div>
  </div>
</body>
</html>
